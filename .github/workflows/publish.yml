name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macOS builds natively per architecture: Homebrew's libomp only exists
        # for the runner's own arch, so x86_64 cannot be cross-built on arm64.
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-15-intel
            macos_arch: x86_64
            macos_target: "15.0"
          - os: macos-14
            macos_arch: arm64
            macos_target: "14.0"

    steps:
      - uses: actions/checkout@v4

      - uses: pypa/cibuildwheel@v2.22.0
        env:
          # Precompiled wheel per CPython version; Cython+numpy come from
          # [build-system].requires, so no CIBW_BEFORE_BUILD needed.
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ARCHS_MACOS: ${{ matrix.macos_arch }}
          # OpenMP on macOS: build against Homebrew's libomp; the default repair
          # step (delocate) copies libomp.dylib into the wheel, so users need
          # nothing installed. The deployment target must not be older than the
          # libomp bottle, which is built for the runner's macOS version.
          CIBW_BEFORE_ALL_MACOS: brew install libomp
          CIBW_ENVIRONMENT_MACOS: >-
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_target }}
            LIBOMP_PREFIX=$(brew --prefix libomp)
          # numpy >= 2.4 dropped manylinux2014 (glibc 2.17) wheels and now
          # ships manylinux_2_28 only. On the default manylinux2014 image pip
          # falls back to compiling numpy from source, which fails against the
          # image's GCC 10.2 ("NumPy requires GCC >= 10.3"). Build on
          # manylinux_2_28 so the prebuilt numpy/scipy wheels are used instead.
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build sdist (user-side source builds)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist --outdir dist .

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - build-wheels
      - build-sdist
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/clypto

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
