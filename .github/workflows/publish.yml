name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pypa/cibuildwheel@v2.22.0
        env:
          # Precompiled wheel per CPython version; Cython+numpy come from
          # [build-system].requires, so no CIBW_BEFORE_BUILD needed.
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          # numpy >= 2.4 dropped manylinux2014 (glibc 2.17) wheels and now
          # ships manylinux_2_28 only. On the default manylinux2014 image pip
          # falls back to compiling numpy from source, which fails against the
          # image's GCC 10.2 ("NumPy requires GCC >= 10.3"). Build on
          # manylinux_2_28 so the prebuilt numpy/scipy wheels are used instead.
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build sdist (user-side source builds)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist --outdir dist .

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - build-wheels
      - build-sdist
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/clypto

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
