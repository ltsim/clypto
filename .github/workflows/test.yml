name: Testing code

on:
  pull_request:
    branches:
      - master

jobs:
  test-cpython:
    name: pytest / ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build Cython extensions in place
        run: uv run --no-sync python setup.py build_ext --inplace

      - name: Run pytest
        run: uv run --no-sync pytest tests/

  wheel-smoke:
    name: smoke test installed wheel / 3.11
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: uv build --wheel

      - name: Install wheel into a clean venv
        run: |
          uv venv .venv-wheel
          uv pip install --python .venv-wheel/bin/python dist/*.whl pytest

      - name: Confirm the compiled wheel is imported
        run: cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/.venv-wheel/bin/python" -c "import clypto; assert 'site-packages' in clypto.__file__"

      - name: Run smoke tests against the installed wheel
        run: .venv-wheel/bin/pytest --import-mode=importlib tests/ -m smoke
