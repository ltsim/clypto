site_name: clypto
site_description: A Cythonized, lightweight catalog of population-based metaheuristic optimizers.
site_url: https://ltsim.github.io/clypto/
repo_url: https://github.com/ltsim/clypto
repo_name: ltsim/clypto
edit_uri: edit/master/docs/
copyright: Maintained by LTSIM &middot; MIT License

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.select
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: en
      separator: '[\s\-.]+'
  - gen-files:
      scripts:
        - docs/scripts/gen_pages.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

exclude_docs: |
  scripts/
  custom-optimizers/_snippets/

validation:
  nav:
    absolute_links: info
  links:
    absolute_links: info
    unrecognized_links: info

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quickstart: quickstart.md
      - Tutorial: tutorial.md
      - Legacy and vectorized collections: vectorization.md
  - Custom Optimizers:
      - Overview: custom-optimizers/index.md
      - Your first optimizer: custom-optimizers/01-first-optimizer.md
      - Hyper-parameters: custom-optimizers/02-parameters.md
      - The population: custom-optimizers/03-population.md
      - Custom agent state: custom-optimizers/04-agent-state.md
      - Classic API and compilation: custom-optimizers/05-legacy-and-compilation.md
      - Migration: custom-optimizers/migration.md
  - Algorithm Categories:
      - Overview: categories/index.md
      - Evolutionary-based: categories/evolutionary_based.md
      - Swarm-based: categories/swarm_based.md
      - Physics-based: categories/physics_based.md
      - Human-based: categories/human_based.md
      - Bio-based: categories/bio_based.md
      - System-based: categories/system_based.md
      - Math-based: categories/math_based.md
      - Music-based: categories/music_based.md
      - Game-based: categories/game_based.md
      - SOTA-based: categories/sota_based.md
  - Known Issues: issues.md
  - API Reference:
      - Core API: api/core.md
  - Reference:
      - Citations: reference/citations.md
      - Changelog: reference/changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ltsim/clypto
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/clypto/
