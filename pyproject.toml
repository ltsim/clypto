[build-system]
requires = ["setuptools>=68.0", "wheel", "Cython>=3.0.0", "numpy>=2.0.2"]
build-backend = "setuptools.build_meta"

[project]
name = "clypto"
dynamic = ["version"]
description = "An Open-source Library for Latest Meta-heuristic Algorithms in Cython"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Thieu", email = "nguyenthieu2102@gmail.com" },
    { name = "LTSIM", email = "tsim@cucei.udg.mx" },
]
requires-python = ">=3.10"
keywords = [
    "optimization",
    "metaheuristics",
    "MHA",
    "mathematical optimization",
    "nature-inspired algorithms",
    "evolutionary computation",
    "soft computing",
    "population-based algorithms",
    "Stochastic optimization",
    "Global optimization",
    "Convergence analysis",
    "Search space exploration",
    "Local search",
    "Computational intelligence",
    "Black-box optimization",
    "Robust optimization",
    "Hybrid algorithms",
    "Benchmark functions",
    "Metaheuristic design",
    "Performance analysis",
    "Exploration versus exploitation",
    "Self-adaptation",
    "Constrained optimization",
    "Intelligent optimization",
    "Adaptive search",
    "Simulations",
    "Algorithm selection",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Benchmark",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "numpy>=2.0.2",
    "scipy>=1.15.3",
    "Cython>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.9.0",
    "twine>=5.0",
    "flake8>=7.0",
    "ruff>=0.16.0",
    "pandas-stubs>=2.2.3",
    "scipy-stubs>=1.15.0",
    "black>=26.5.1",
]

[project.urls]
Homepage = "https://github.com/ltsim/clypto"
"Source Code" = "https://github.com/ltsim/clypto"
"Bug Tracker" = "https://github.com/ltsim/clypto/issues"
"Change Log" = "https://github.com/ltsim/clypto/blob/master/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "clypto.__version__" }

[tool.setuptools.packages.find]
exclude = ["tests*", "examples*"]

[tool.uv]
# The Cython extension (ext_modules, built via setup.py's cythonize() call --
# not expressible declaratively in pyproject.toml) must be compiled in place
# for editable installs to import the .so files rather than stale/missing ones.
package = true

[tool.ruff]
line-length = 180
target-version = "py310"
exclude = ["build", "*.c", "*.so"]

[tool.ruff.lint]
# Mirrors the existing .flake8 selection (pycodestyle, pyflakes, mccabe,
# flake8-comprehensions/bugbear) rather than ruff's much larger default
# preview ruleset, which flags mostly cosmetic/naming issues across this
# algorithm-heavy codebase that aren't worth the churn right now.
select = ["E", "F", "W", "B", "C4", "C90"]
ignore = ["E203", "E266"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.mypy]
ignore_missing_imports = true
exclude = ["build/", "^.*\\.c$"]